name: Bug report
description: A retrieval, generation or evaluation step returned wrong results or failed
labels: [bug]
body:
  - type: dropdown
    id: stage
    attributes:
      label: Stage
      options: [ingest and chunking, retrieval, re-ranking, generation, evaluation, API]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration and command
      description: The pipeline config (YAML) and the exact command you ran.
      render: shell
